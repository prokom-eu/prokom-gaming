# Production deploy (G16): only by hand, after the boss's acceptance in Asana (CLAUDE.md,
# docs/wdrozenia.md). Input: the SHA that runs on staging now — the server refuses any other
# (scripts/server/deploy-gate.sh), so production always gets the image staging and the boss saw.
# The server runs scripts/deploy.sh prod: backup `predeploy` → pull → health → smoke test →
# automatic rollback (then this run is red). From the terminal (/wdrozenie produkcja):
#   gh workflow run deploy-production.yml -f sha=<SHA>
# Secrets and variables: environment `production` (docs/runbook.md „Klucze pipeline'u”).

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit SHA that runs on staging now (APP_IMAGE_TAG of .env.staging)'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: backup · deploy · smoke · rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # lock wait + backup + health + smoke + rollback
    environment: production
    steps:
      - name: Commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="$INPUT_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Only commits from develop
        env:
          SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # develop...SHA: "identical" or "behind" = the commit is in develop's history.
          status="$(gh api "repos/${{ github.repository }}/compare/develop...$SHA" --jq .status)"
          case "$status" in identical | behind) ;; *) echo "::error::$SHA is not on develop ($status)"; exit 1 ;; esac

      - name: SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (backup, image + its deploy files, smoke test, rollback on failure)
        env:
          SHA: ${{ steps.target.outputs.sha }}
          TARGET: ${{ vars.PRODUCTION_SSH_TARGET }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$TARGET" "deploy prod $SHA" </dev/null

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
