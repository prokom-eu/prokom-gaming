# Local development only: PostgreSQL + Mailpit (+ Umami on demand).
# Start: docker compose -f docker/compose.dev.yml up -d
# With statistics (ADR-G009): docker compose -f docker/compose.dev.yml --profile umami up -d
# Ports are bound to 127.0.0.1, so nothing is exposed to the network. Host ports differ from
# prokom-web (54320, 1025/8025), so both projects run side by side (ADR-G001 §4).
# Credentials below are for local development only and match .env.example.

name: prokom-gaming-dev

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prokom
      POSTGRES_PASSWORD: prokom
      POSTGRES_DB: prokom_gaming
    ports:
      - '127.0.0.1:54321:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prokom -d prokom_gaming']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:1026:1025' # SMTP
      - '127.0.0.1:8026:8025' # web UI: http://localhost:8026

  # Statistics without cookies (ADR-G009), only when asked for: `--profile umami`. Its own database
  # `umami` in the same PostgreSQL; the panel at http://localhost:3110 (first login from the Umami
  # docs: admin / umami — local only), the script at http://localhost:3110/script.js.
  umami-db:
    image: postgres:17.11-alpine
    profiles: ['umami']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: prokom
    # Idempotent: creates the database only when missing (works on an existing volume too).
    command: >-
      sh -c "psql -h postgres -U prokom -d prokom_gaming -tAc
      \"SELECT 1 FROM pg_database WHERE datname = 'umami'\" | grep -q 1
      || psql -h postgres -U prokom -d prokom_gaming -c 'CREATE DATABASE umami'"
    restart: 'no'

  umami:
    # Pinned (ADR-G009 pt 1): the image of the Umami docs, release 3.4.1.
    image: docker.umami.is/umami-software/umami:3.4.1
    profiles: ['umami']
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://prokom:prokom@postgres:5432/umami
      APP_SECRET: local-development-only-not-a-secret
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
    ports:
      - '127.0.0.1:3110:3000'
    # Start of ADR-G009 (256–384 MB); measured locally in G15, see docs/STAN.md.
    mem_limit: 384m

volumes:
  pgdata:
