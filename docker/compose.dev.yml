# Local development only: PostgreSQL + Mailpit.
# Start: docker compose -f docker/compose.dev.yml up -d
# Ports are bound to 127.0.0.1, so nothing is exposed to the network. Host ports differ from
# prokom-web (54320, 1025/8025), so both projects run side by side (ADR-G001 §4).
# Credentials below are for local development only and match .env.example.

name: prokom-gaming-dev

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prokom
      POSTGRES_PASSWORD: prokom
      POSTGRES_DB: prokom_gaming
    ports:
      - '127.0.0.1:54321:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prokom -d prokom_gaming']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:1026:1025' # SMTP
      - '127.0.0.1:8026:8025' # web UI: http://localhost:8026

volumes:
  pgdata:
