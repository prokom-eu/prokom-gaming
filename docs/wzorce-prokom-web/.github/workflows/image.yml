# Production image (ADR-004): built once per merge into develop, pushed to GHCR with the commit
# SHA as its tag. Only develop: a squash merge into main makes a new commit, and a rebuild there
# would ship an image staging never ran. Production gets the tested develop image by its tag
# (promotion in the S10 pipeline).

name: Image

on:
  push:
    branches: [develop]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false # every merged commit gets its image

permissions:
  contents: read
  packages: write # push to ghcr.io/prokom-eu/prokom-web

jobs:
  image:
    name: build · push to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/prokom-eu/prokom-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache in GitHub Actions: dependencies rebuild only when the lockfile changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
