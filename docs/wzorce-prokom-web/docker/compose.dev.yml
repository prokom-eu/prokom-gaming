# Local development only: PostgreSQL + Mailpit.
# Start: docker compose -f docker/compose.dev.yml up -d
# Ports are bound to 127.0.0.1, so nothing is exposed to the network.
# Credentials below are for local development only and match .env.example.

name: prokom-web-dev

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prokom
      POSTGRES_PASSWORD: prokom
      POSTGRES_DB: prokom_web
    ports:
      - '127.0.0.1:54320:5432' # 54320 on the host: avoids clashing with natively installed PostgreSQL (5432, 5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prokom -d prokom_web']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # web UI: http://localhost:8025

volumes:
  pgdata:
