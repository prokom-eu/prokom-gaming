.rs{display:inline-block;flex:none;vertical-align:middle}
.ic{flex:none}
.nav{position:absolute;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:30px;padding:24px 40px}
.nav.solid{position:relative;background:linear-gradient(180deg,#030605,#06100d);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;flex-direction:column;line-height:1}
.logo b{font-family:Archivo,sans-serif;font-stretch:118%;font-weight:800;font-size:23px;letter-spacing:-.01em;color:var(--kosc)}
.logo b i{font-style:normal;color:var(--grom)}
.logo span{align-self:flex-end;margin-top:5px;padding-top:4px;border-top:2px solid var(--grom);font-size:10px;font-weight:800;letter-spacing:.32em;color:var(--kosc2)}
.nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:15px;font-weight:600;color:#d6cdb7}
.nav ul a{padding:6px 0;border-bottom:2px solid transparent}
.nav ul a:hover,.nav ul a.on{color:#fff;border-color:var(--grom)}
.nav .sp{flex:1}
.nphone{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:#bdb39b}
.ico{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:#d6cdb7;background:rgba(4,7,6,.4)}
.ico em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--grom);color:#1a1305;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;background:linear-gradient(180deg,var(--grom2),var(--grom));color:#1a1305!important;font-weight:800;font-size:15.5px;border:0;cursor:pointer;white-space:nowrap;
 box-shadow:0 0 0 1px rgba(255,224,138,.45),0 12px 40px -10px rgba(242,194,48,.6);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,224,138,.6),0 16px 50px -10px rgba(242,194,48,.75)}
.btn.lg{min-height:58px;padding:0 34px;font-size:17px}
.btn.ghost{background:rgba(236,228,208,.06);color:var(--kosc)!important;box-shadow:inset 0 0 0 1px rgba(236,228,208,.22)}
.btn.ghost:hover{background:rgba(236,228,208,.1)}
.lnk{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;border-bottom:1px solid rgba(236,228,208,.35);padding-bottom:3px}
.lnk.g{color:var(--grom)!important;border-color:rgba(242,194,48,.45)}
.pg a:focus-visible,.pg button:focus-visible,.pg input:focus-visible,.pg select:focus-visible{outline:3px solid var(--grom2);outline-offset:3px}
.sec{padding:120px 0}
.sh h2{margin:0;font-size:58px;color:var(--kosc)}
.sh p{margin:18px 0 0;max-width:640px;font-size:18px;line-height:1.65;color:#c4bba5}
.kick{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;color:var(--kosc2);margin-bottom:16px}
.pcs{filter:drop-shadow(0 0 16px currentColor) drop-shadow(0 0 40px color-mix(in srgb,currentColor 35%,transparent));overflow:visible}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid rgba(236,228,208,.16);background:transparent;font-size:14px;font-weight:600;color:#d6cdb7;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--grom);color:#1a1305;border-color:var(--grom)}
.cut{clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.panel{background:linear-gradient(180deg,#0c1512,#070c0a);border:1px solid rgba(236,228,208,.1)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}

.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}

.oeyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.owlfly{animation:owlf 16s linear infinite}@keyframes owlf{0%{transform:translate(1500px,180px)}100%{transform:translate(-200px,60px)}}
.whirl{animation:sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.whirl.r{animation-direction:reverse;animation-duration:9s}
.spinw{animation:sp 3s linear infinite;transform-box:fill-box;transform-origin:center}
.mwheel{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.smoke circle{animation:smoke 6s ease-out infinite;transform-box:fill-box}.smoke circle:nth-child(2){animation-delay:-2s}.smoke circle:nth-child(3){animation-delay:-4s}

.ffly{animation:ffly 7s ease-in-out infinite}@keyframes ffly{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(14px,-18px)}}
.wr{animation:float 14s ease-in-out infinite alternate}.w2{animation-duration:18s}.w3{animation-duration:11s}@keyframes float{to{transform:translateX(80px)}}
.flame{animation:flick .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes flick{to{transform:scaleY(1.25) scaleX(.85)}}
.lantern{animation:pulse 2.4s ease-in-out infinite}
.mirrors{animation:pulse 3.4s ease-in-out infinite}.beye{animation:blink 7s infinite;transform-box:fill-box;transform-origin:center}
.bat{animation:bat 12s linear infinite}.b2{animation-duration:15s;animation-delay:-6s}@keyframes bat{0%{transform:translate(200px,620px)}50%{transform:translate(420px,520px)}100%{transform:translate(640px,600px)}}
